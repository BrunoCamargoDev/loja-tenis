{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow">

  <h1 class="text-2xl font-semibold mb-6 text-gray-800">
    Cadastro de Tênis
  </h1>

  <form method="POST" action="{% url 'cadastrar_tenis' %}" enctype="multipart/form-data" class="space-y-5">
    {% csrf_token %}

    <!-- Nome -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Nome do tênis
      </label>
      <input
        type="text"
        name="nome"
        required
        class="w-full rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-blue-500"
      >
    </div>

    <!-- Descrição -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Descrição
      </label>
      <textarea
        name="descricao"
        rows="3"
        required
        class="w-full rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-blue-500"
      ></textarea>
    </div>

    <!-- Preço -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Preço padrão(R$)
      </label>
      <input
        type="number"
        name="preco"
        step="0.01"
        min="0"
        required
        class="w-full rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-blue-500"
      >
    </div>

    <!-- Preço Promocional -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Preço promocional (R$)
      </label>
      <input
        type="number"
        name="preco_promocional"
        step="0.01"
        min="0"
        class="w-full rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-blue-500"
      >
    </div>

    <!-- Estoque -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Quantidade em estoque
      </label>
      <input
        type="number"
        name="estoque"
        min="0"
        required
        class="w-full rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-blue-500"
      >
    </div>

    <!-- Categoria -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Categoria
      </label>
      <select
        name="categoria"
        required
        class="w-full rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-blue-500"
      >
        <option value="" disabled selected>Selecione uma categoria</option>
        {% for categoria in categorias %}
          <option value="{{ categoria.id }}">{{ categoria.nome }}</option>
        {% endfor %}
      </select>
    </div>


    <!-- Marca -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Marca
      </label>
      <select
        name="marca"
        required
        class="w-full rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-blue-500"
      >
        <option value="" disabled selected>Selecione uma marca</option>
        {% for marca in marcas %}
          <option value="{{ marca.id }}">{{ marca.nome }}</option>
        {% endfor %}
      </select>
    </div>


    <!-- Imagem -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Imagem do tênis
      </label>
      <input
        type="file"
        name="imagem"
        accept="image/*"
        class="block w-full text-sm text-gray-600
               file:mr-4 file:py-2 file:px-4
               file:rounded-lg file:border-0
               file:bg-blue-50 file:text-blue-600
               hover:file:bg-blue-100"
      >
    </div>

    <!-- Destaque -->
    <div class="flex items-center gap-2">
      <input
        type="checkbox"
        name="DestaquePrincipal"
        class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
      >
      <label class="text-sm text-gray-700">
        Marcar como destaque principal
      </label>
    </div>

    <!-- Botões -->
    <div class="flex justify-end gap-3 pt-4">
      <a
        href="{% url 'dashboard_home' %}"
        class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100"
      >
        Cancelar
      </a>

      <button
        type="submit"
        class="px-6 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700"
      >
        Salvar
      </button>
    </div>

  </form>
</div>
{% endblock %}
