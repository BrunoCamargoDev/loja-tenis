<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login | Dashboard</title>
  {% load static %}
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-900">

  <div class="w-full max-w-md bg-slate-800 p-8 rounded-xl shadow-lg">

    <h1 class="text-2xl font-bold text-white text-center mb-6">
      Login de Usuário
    </h1>

    {% if messages %}
      {% for message in messages %}
        <p class="mb-4 text-center text-red-400">
          {{ message }}
        </p>
      {% endfor %}
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <input
          type="text"
          name="username"
          placeholder="Usuário"
          required
          class="w-full px-4 py-3 rounded-lg bg-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:blue-200"
        >
      </div>

      <div>
        <input
          type="password"
          name="password"
          placeholder="Senha"
          required
          class="w-full px-4 py-3 rounded-lg bg-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200"
        >
      </div>

      <button
        type="submit"
        class="w-full py-3 rounded-lg bg-blue-500 hover:bg-blue-600 transition font-semibold text-slate-900"
      >
        Entrar
      </button>

      <button type="button" class="w-full py-3 rounded-lg bg-slate-600 hover:bg-slate-700 transition font-semibold text-slate-300">
        <a href="{% url 'cadastrar_usuario' %}">Cadastrar</a>
      </button>
    </form>

  </div>

</body>
</html>
